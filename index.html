<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPI Anekdot – Mengungkapkan Kritik lewat Senyuman</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#fff0f6,#ffd0e6);min-height:100vh;color:#5b1a3a}
h2{font-weight:800;font-size:1.6rem;color:#be185d;line-height:1.2}
.btn{background:#ec4899;color:#fff;font-weight:800;border-radius:1rem;padding:.6rem 1.3rem;box-shadow:0 4px 0 #be185d;transition:transform .15s,background .15s;cursor:pointer}
.btn:hover{background:#db2777;transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #be185d}
.btn.btn2{background:#fff;color:#9d174d;border:2px solid #f9a8d4;box-shadow:0 4px 0 #f9a8d4}
.btn.btn2:hover{background:#fdf2f8}
.btn:disabled{background:#f9a8d4;box-shadow:none;cursor:not-allowed;transform:none}
.card{background:#fff;border-radius:1.5rem;box-shadow:0 8px 24px #f472b633;padding:1.25rem}
.slot{display:inline-block;min-width:8rem;border-bottom:4px dashed #ec4899;text-align:center;font-weight:800;color:#be185d;padding:0 .5rem}
@keyframes pop{0%{opacity:0;transform:scale(.7) translateY(30px)}100%{opacity:1;transform:none}}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bob{50%{transform:translateY(-14px)}}
.bob{animation:bob 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.pop,.bob{animation:none}}
@media print{.noprint,#home,footer{display:none!important}body{background:#fff}}
</style></head>

const mel=[523,659,784,659,880,784,659,523,587,698,880,698,784,659,587,523];

function tone(f,d,t='sine',v=.25,at=0){if(!AC||S.vol==0)return;const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+at;o.type=t;o.frequency.value=f;o.connect(g);g.connect(mg);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}
function music(){clearInterval(mt);if(S.music&&AC)mt=setInterval(()=>{tone(mel[step%16],.25,'triangle',.12);if(step%4==0)tone(mel[step%16]/2,.5,'sine',.1);step++},300)}
const ok=()=>{tone(660,.15,'triangle');tone(880,.2,'triangle',.25,.12)},bad=()=>tone(180,.3,'sawtooth',.15),click=()=>tone(900,.06,'square',.08),win=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.25,i*.12));
document.addEventListener('click',e=>{if(e.target.closest('button'))click()});
function togM(){S.music=!S.music;music();$('#mt').textContent='🎵 Musik: '+(S.music?'ON':'OFF')}

function ans(b,k,a){const bs=[...b.parentNode.children],G1='!bg-green-400 !text-white !border-green-500';bs.forEach(x=>x.disabled=true);
if(k==a){Q.c++;ok();b.classList.add(...G1.split(' '))}else{bad();b.classList.add('!bg-red-400','!text-white');bs[a].classList.add(...G1.split(' '))}

function done(c,n,p){const{g,l}=Q,last=l+1>=G[g].lv.length;if(p&&!last&&P[g]<l+2)P[g]=l+2;p?win():bad();
